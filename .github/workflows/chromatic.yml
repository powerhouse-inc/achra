name: 'Chromatic DSPOT'

on:
  pull_request:
    branches: ['main', 'staging', 'dev']
    types: [opened, synchronize]
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Storybook lives in apps/frontend and pulls in workspace deps; build
      # @powerhousedao/op-hub (its dist/ output is gitignored) before the
      # Storybook build so module resolution doesn't fall through to a missing dist.
      - name: Build workspace deps
        run: pnpm --filter "frontend^..." run build

      - name: Run Chromatic
        uses: chromaui/action@v13.3.5
        with:
          projectToken: ${{ secrets.CHROMATIC_DSPOT_PROJECT_TOKEN }}
          workingDir: apps/frontend # Storybook project lives in the frontend app
          exitZeroOnChanges: false # fail on changes
          onlyChanged: true # enable TurboSnap https://www.chromatic.com/docs/turbosnap
