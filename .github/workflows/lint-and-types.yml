name: Lint and Type Check

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'staging', 'dev']
    types: [opened, synchronize]

jobs:
  lint-and-types:
    name: Lint and Types Checks
    runs-on: ubuntu-latest
    container: node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # frontend's type-check resolves @powerhousedao/op-hub types from its
      # dist/ output (gitignored), so build frontend's workspace deps first.
      - name: Build workspace deps
        run: pnpm --filter "frontend^..." run build

      - name: Lint
        run: pnpm --filter frontend run lint

      - name: Code Format
        run: pnpm --filter frontend run format:check

      - name: Type check
        run: pnpm --filter frontend run type-check
